[project]
name = "langchain-basics"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.2.10",
    "langchain-groq>=1.1.2",
    "langchain-tavily>=0.2.17",
    "pip>=26.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "tavily>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]


[tool.ruff]
line-length = 100
# Set the target Python version
target-version = "py311"

[tool.ruff.lint]
# Enable all rules from pycodestyle (E), pyflakes (F), isort (I), etc.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"] # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["gen_agent"]


